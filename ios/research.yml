# Opt-in overlay. The default project/scheme never builds this test bundle.
# Generate TyprResearch.xcodeproj separately; do not replace Typr.xcodeproj.
include:
  - project.yml
name: TyprResearch
targets:
  TyprResearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TyprTests/DecoderStatisticsEvaluationTests.swift
      - TyprTests/KeyboardBoundaryDecoderTests.swift
      - TyprTests/KeyboardBoundaryEvaluationTests.swift
      - TyprTests/KeyboardBoundaryMultipartTests.swift
      - TyprTests/KeyboardContextCorpusTests.swift
      - TyprTests/KeyboardContextEvaluationTests.swift
      - TyprTests/KeyboardKeyMapEvaluationFixtures.swift
      - TyprTests/KeyboardKeyMapTests.swift
      - TyprTests/KeyboardSuggestionEvaluationTests.swift
      - TyprTests/KeyboardTestSupport.swift
      - TyprTests/PersonalTrigramPhraseFixtures.swift
      - TyprTests/PersonalTypingAimEvaluationTests.swift
      - TyprTests/PersonalTypingBigramEvaluationTests.swift
      - TyprTests/PersonalTypingTrigramEvaluationTests.swift
      - TyprTests/SpatialTypoEvaluationEvidence.swift
      - TyprTests/SpatialTypoEvaluationFixtures.swift
      - TyprTests/SpatialTypoEvaluationTests.swift
    dependencies:
      - target: Typr
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.rudek.typr.research-tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TYPR_RESEARCH
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Typr.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Typr
schemes:
  TyprResearch:
    build:
      targets:
        TyprResearchTests: [test]
    test:
      config: Debug
      targets:
        - TyprResearchTests
