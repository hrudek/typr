# Independent result in Actions: tests never gate a TestFlight upload.
name: Simulator tests
run-name: "Simulator tests · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      only_testing:
        description: "Comma-separated -only-testing targets (empty: all, none: skip)"
        type: string
        default: ""
      scenes:
        description: "Extra screenshot scenes, comma-separated"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: typr-simulator-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.decide.outputs.test }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - name: Require configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Set repository variable APPLE_TEAM_ID'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/typr
          persist-credentials: false
      - name: Load identity
        id: config
        run: python3 .github/typr/config.py
      - name: Which iOS lanes changed, and what gets signed?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISTRIBUTION: simulator
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/typr/decide-lanes.sh

  test:
    name: Simulator tests
    needs: decide
    if: needs.decide.outputs.test == 'true' && inputs.only_testing != 'none'
    concurrency:
      group: typr-ci-test-${{ github.event_name == 'push' && 'push' || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    env:
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/typr/select-xcode.sh
      - name: Cache keys (Xcode, month)
        id: cache-keys
        run: |
          xcode=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$3} END{print v "-" b}')
          echo "spm=typr-spm-$xcode-${{ hashFiles('ios/project.yml') }}" >> "$GITHUB_OUTPUT"
          # A new compilation cache each month, so it never grows without bound.
          echo "cas=typr-cas-test-${{ runner.arch }}-$xcode-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-keys.outputs.cas }}
      - name: Run unit tests on the simulator
        id: tests
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: bash .github/typr/test.sh
      - name: Screenshots of the app's scenes (same build, no second compile)
        if: github.event_name == 'workflow_dispatch' && !cancelled() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        env:
          SCENES: ${{ inputs.scenes }}
        run: bash .github/typr/screenshots.sh
      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typr-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typr-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/test-output
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Swift package checkouts
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Save compilation cache
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
