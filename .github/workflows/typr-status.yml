# Typr: keep the pinned issue "Typr status" current.
# Refreshed after each independent main lane, weekly, or by hand.
# gh only; runs Typr's status.py from main, never branch code.
name: Typr status
run-name: "Typr status · ${{ github.event_name }}"

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: [Checks, Simulator tests, TestFlight]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: typr-status
  cancel-in-progress: true

jobs:
  status:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          sparse-checkout: .github/typr
          persist-credentials: false
      - name: Rewrite the status issue
        run: python3 -I .github/typr/status.py >> "$GITHUB_STEP_SUMMARY"
